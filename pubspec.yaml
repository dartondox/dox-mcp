name: dox_mcp
description: "Model Context Protocol (MCP) server for the Dox framework: tools over Streamable HTTP, with signed sessions that work on every isolate."
version: 3.2.1
repository: https://github.com/dartondox/dox-mcp
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.6
  dox_annotation: ^3.2.0
  dox_cache: ^3.2.0
  dox_core: ^3.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here (`dox mcp:install`).
dox:
  commands: package:dox_mcp/commands.dart
